$kind: http-request
url: "{{baseUrl}}/api/claims/me"
method: GET
headers:
  Authorization: Bearer {{studentToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.expect(pm.response.code).to.eql(200); });
      const json = pm.response.json();
      pm.test("Claims payload is present", function () { pm.expect(Array.isArray(json) || Object.keys(json || {}).length > 0).to.eql(true); });
    language: text/javascript
order: 3000
