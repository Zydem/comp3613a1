$kind: http-request
url: "{{baseUrl}}/api/claims/{{claimId}}"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "action": "approve",
      "hours": 4.5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.expect(pm.response.code).to.eql(200); });
      const json = pm.response.json();
      pm.test("Review payload includes message or claim", function () { pm.expect(json.message || json.claim).to.exist; });
      pm.test("Response contains a key field", function () { const keys = Object.keys(json || {}); pm.expect(keys.length > 0).to.eql(true); });
    language: text/javascript
order: 2000
