$kind: http-request
name: Hours 30 -> 400
url: "{{baseUrl}}/api/claims"
method: POST
headers:
  Authorization: Bearer {{studentToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "activity": "Weekend volunteering",
      "date": "2026-11-10",
      "hours": 30,
      "description": "This claim should fail validation",
      "proof": "bad-data"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () { pm.expect(pm.response.code).to.eql(400); });
      const json = pm.response.json();
      pm.test("Error payload contains detail", function () { pm.expect(json.detail).to.be.a("string"); });
      pm.test("Response contains a key field", function () { const keys = Object.keys(json || {}); pm.expect(keys.length > 0).to.eql(true); });
    language: text/javascript
order: 5000
