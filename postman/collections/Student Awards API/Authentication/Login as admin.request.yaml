$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin",
      "password": "adminpass"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.expect(pm.response.code).to.eql(200); });
      const json = pm.response.json();
      pm.test("Admin login returns a token", function () { pm.expect(json.access_token).to.be.a("string"); });
      if (json.access_token) { pm.collectionVariables.set('adminToken', json.access_token); }
      pm.test("Response contains a key field", function () { const keys = Object.keys(json || {}); pm.expect(keys.length > 0).to.eql(true); });
    language: text/javascript
order: 2000
