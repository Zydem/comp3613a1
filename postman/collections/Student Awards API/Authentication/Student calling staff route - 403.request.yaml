$kind: http-request
name: Student calling staff route -> 403
url: "{{baseUrl}}/api/claims?status=pending"
method: GET
headers:
  Authorization: Bearer {{studentToken}}
queryParams:
  status: pending
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () { pm.expect(pm.response.code).to.eql(403); });
      const json = pm.response.json();
      pm.test("Error payload contains detail", function () { pm.expect(json.detail).to.be.a("string"); });
      pm.test("Response contains a key field", function () { const keys = Object.keys(json || {}); pm.expect(keys.length > 0).to.eql(true); });
    language: text/javascript
order: 4000
